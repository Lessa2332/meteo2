function fromDispTemp(v,units){return units==='imperial'?Math.round(((v-32)*5/9)*10)/10:Math.round(v*10)/10;}

const TGRAD=[[-25,[30,64,175]],[-15,[59,130,246]],[-5,[147,197,253]],[0,[186,230,253]],[8,[167,243,208]],[16,[253,224,71]],[22,[251,146,60]],[28,[239,68,68]],[36,[185,28,28]]];
function tempColor(c){
  if(c<=TGRAD[0][0]){const r=TGRAD[0][1];return `rgb(${r[0]},${r[1]},${r[2]})`;}
  if(c>=TGRAD[TGRAD.length-1][0]){const r=TGRAD[TGRAD.length-1][1];return `rgb(${r[0]},${r[1]},${r[2]})`;}
  for(let i=1;i<TGRAD.length;i++){
    const [c1,rgb1]=TGRAD[i];
    if(c<=c1){const [c0,rgb0]=TGRAD[i-1];const r=(c-c0)/(c1-c0);
      return `rgb(${Math.round(rgb0[0]+(rgb1[0]-rgb0[0])*r)},${Math.round(rgb0[1]+(rgb1[1]-rgb0[1])*r)},${Math.round(rgb0[2]+(rgb1[2]-rgb0[2])*r)})`;}
  }
  return '#3B82F6';
}
function contrastText(c){return (c<-5||c>26)?'#fff':'#0f172a';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ─────────────── 6. Конфеті (canvas) ─────────────── */
function confetti(){
  try{
    const cvs=document.createElement('canvas');
    cvs.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:999;';
    cvs.width=innerWidth;cvs.height=innerHeight;
    document.body.appendChild(cvs);
    const ctx=cvs.getContext('2d');
    const parts=[];const colors=['#F59E0B','#10B981','#3B82F6','#EC4899','#8B5CF6','#EF4444'];
    for(let i=0;i<70;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*180,y:innerHeight*.6,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,g:.35,sz:4+Math.random()*6,c:colors[i%colors.length],r:Math.random()*Math.PI,rv:(Math.random()-.5)*.3,life:0});
    let frames=0;
    const tick=()=>{
      frames++;ctx.clearRect(0,0,cvs.width,cvs.height);
      parts.forEach(p=>{p.life++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.rv;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.6);ctx.restore();});
      if(frames<90)requestAnimationFrame(tick);else cvs.remove();
    };tick();
  }catch(e){}
}

/* ─────────────── 9. Open-Meteo API ─────────────── */
function weatherCodeToSky(code){
  if(code===0)return 'clear';
  if(code===1||code===2)return 'partly';
  if(code===3)return 'cloudy';
  if(code>=51&&code<=67)return 'rain';
  if(code>=71&&code<=77)return 'snow';
  if(code>=95)return 'storm';
  if(code===45||code===48)return 'fog';
  return 'partly';
}
async function fetchOpenMeteo(city,dateKeys){
  if(city.lat==null||city.lon==null||!dateKeys.length)return {};
  const sorted=[...dateKeys].sort();
  const params=new URLSearchParams({latitude:city.lat.toFixed(2),longitude:city.lon.toFixed(2),
    hourly:'temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m',
    wind_speed_unit:'ms',timezone:'auto',start_date:sorted[0],end_date:sorted[sorted.length-1]});
  const urls=[`https://api.open-meteo.com/v1/forecast?${params}`,`https://archive-api.open-meteo.com/v1/archive?${params}`];
  let data=null;
  for(const u of urls){try{const r=await fetch(u);if(r.ok){data=await r.json();if(data&&data.hourly)break;}}catch(e){}}
  if(!data||!data.hourly||!Array.isArray(data.hourly.time))return {};
  const out={};const h=data.hourly;
  h.time.forEach((timeStr,i)=>{
    const [datePart,hourPart]=timeStr.split('T');
    if(hourPart==='12:00'||(!out[datePart]&&hourPart==='09:00')){
      const deg=h.wind_direction_10m[i];
      const dir=Math.round((((deg%360)+360)%360)/45)%8;
      out[datePart]={temp:Math.round(h.temperature_2m[i]*10)/10,hum:Math.round(h.relative_humidity_2m[i]),
        wind:Math.round(h.wind_speed_10m[i]*10)/10,dir,sky:weatherCodeToSky(h.weather_code[i]),at:new Date().toISOString()};
    }
  });
  return out;
}
async function searchCities(query,lang){
  if(!query||query.trim().length<2)return [];
  try{
    const p=new URLSearchParams({name:query.trim(),count:'8',language:lang,format:'json'});
    const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?${p}`);
    if(!r.ok)return [];
    const d=await r.json();
    if(!d.results)return [];
    return d.results.map(x=>({name:x.name,admin:x.admin1||'',country:x.country||'',lat:Math.round(x.latitude*100)/100,lon:Math.round(x.longitude*100)/100,tz:x.timezone||null}));
  }catch(e){return [];}
}
async function reverseGeo(lat,lon,lang){
  try{
    const p=new URLSearchParams({lat:(Math.round(lat*100)/100).toString(),lon:(Math.round(lon*100)/100).toString(),format:'json',zoom:'10','accept-language':lang});
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?${p}`);
    if(!r.ok)return null;
    const d=await r.json();const a=d.address||{};
    return {name:a.city||a.town||a.village||a.municipality||a.state||'Моє місто',admin:a.state||a.county||'',country:a.country||'',lat:Math.round(lat*100)/100,lon:Math.round(lon*100)/100};
  }catch(e){return null;}
}

/* ─────────────── 16. View: Stats ─────────────── */
function viewStats(){
  const p=profile();
  const prefix=viewY+'-'+String(viewM+1).padStart(2,'0')+'-';
  const dim=daysInMonth(viewY,viewM);
  const mrecs=Object.entries(p.records).filter(([k])=>k.startsWith(prefix))
    .sort(([a],[b])=>a.localeCompare(b)).map(([k,r])=>({...r,key:k,day:+k.split('-')[2]}));

  if(!mrecs.length)return `<div class="card"><h3 style="margin:0 0 8px;">${esc(t('chartTitle'))}</h3><p style="color:var(--ink3);text-align:center;padding:40px 0;font-size:.85rem;">${esc(t('chartEmpty'))}</p></div>`;

  const temps=mrecs.map(r=>r.temp);
  const avg=temps.reduce((a,b)=>a+b,0)/temps.length;
  let maxRec=mrecs[0],minRec=mrecs[0],wet=0;const dirCount=[0,0,0,0,0,0,0,0];
  mrecs.forEach(r=>{if(r.temp>maxRec.temp)maxRec=r;if(r.temp<minRec.temp)minRec=r;
    if(['rain','storm','snow'].includes(r.sky))wet++;
    if(r.dir!=null&&r.dir>=0&&r.dir<8)dirCount[r.dir]++;});
  const maxDir=Math.max(...dirCount),topDir=maxDir>0?dirCount.indexOf(maxDir):null;

  // SVG chart
  const W=640,H=240,pL=45,pR=25,pT=20,pB=35;
  const allT=[...mrecs.map(r=>toDispTemp(r.temp,S.units)),...mrecs.filter(r=>r.real).map(r=>toDispTemp(r.real.temp,S.units))];
  let minT=Math.floor(Math.min(...allT)-2),maxT=Math.ceil(Math.max(...allT)+2);
  if(minT===maxT){minT-=5;maxT+=5;}
  const sx=d=>pL+((d-1)/(dim-1||1))*(W-pL-pR);
  const sy=v=>H-pB-((v-minT)/(maxT-minT))*(H-pT-pB);
  const userPts=mrecs.map(r=>`${sx(r.day)},${sy(toDispTemp(r.temp,S.units))}`).join(' ');
  const satRecs=mrecs.filter(r=>r.real);
  const satPts=satRecs.map(r=>`${sx(r.day)},${sy(toDispTemp(r.real.temp,S.units))}`).join(' ');
  const zeroY=S.units==='metric'?sy(0):sy(32);
  let grid='';
  [minT,Math.round((minT+maxT)/2),maxT].forEach(v=>{
    grid+=`<line x1="${pL}" x2="${W-pR}" y1="${sy(v)}" y2="${sy(v)}" stroke="#E2E8F0" stroke-dasharray="4 4"/>
      <text x="${pL-8}" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="#94A3B8" font-family="JetBrains Mono" font-weight="700">${v}°</text>`;
  });
  let dayMarks='';
  [1,5,10,15,20,25,dim].forEach(d=>{if(d<=dim)dayMarks+=`<text x="${sx(d)}" y="${H-12}" text-anchor="middle" font-size="10" fill="#94A3B8" font-family="JetBrains Mono" font-weight="700">${d}</text>`;});
  const chart=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:var(--font);">
    ${grid}
    ${zeroY>=pT&&zeroY<=H-pB?`<line x1="${pL}" x2="${W-pR}" y1="${zeroY}" y2="${zeroY}" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3"/>`:''}
    ${satRecs.length>1?`<polyline fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="5 4" points="${satPts}"/>`:''}
    ${mrecs.length>1?`<polyline fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${userPts}"/>`:''}
    ${satRecs.map(r=>`<circle cx="${sx(r.day)}" cy="${sy(toDispTemp(r.real.temp,S.units))}" r="3.5" fill="#F59E0B" stroke="#fff" stroke-width="1.5"/>`).join('')}
    ${mrecs.map(r=>`<circle cx="${sx(r.day)}" cy="${sy(toDispTemp(r.temp,S.units))}" r="5.5" fill="${tempColor(r.temp)}" stroke="#fff" stroke-width="2"/>`).join('')}
    ${dayMarks}
  </svg>`;

  // Wind rose
  const sz=180,cn=sz/2,mr=60;
  const pts=dirCount.map((c,i)=>{const a=(i*45-90)*Math.PI/180;const r=(c/Math.max(maxDir,1))*mr;return `${cn+r*Math.cos(a)},${cn+r*Math.sin(a)}`;}).join(' ');
  const rose=`<svg viewBox="0 0 ${sz} ${sz}" style="width:180px;height:180px;">
    <circle cx="${cn}" cy="${cn}" r="${mr*.5}" fill="none" stroke="#E2E8F0"/>

/* ─────────────── 17. Bind view handlers ─────────────── */
function bindView(){
  // Calendar
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{playStep(+b.dataset.nav>0);viewM+=+b.dataset.nav;if(viewM<0){viewM=11;viewY--;}else if(viewM>11){viewM=0;viewY++;}render();});
  const btnToday=document.getElementById('btnToday');
  if(btnToday)btnToday.onclick=()=>{playTap();const d=new Date();viewY=d.getFullYear();viewM=d.getMonth();render();};
  document.querySelectorAll('.cal-day').forEach(b=>b.onclick=()=>{if(b.disabled)return;playTap();openRecordModal(b.dataset.day);});
  const btnAdd=document.getElementById('btnAdd');
  if(btnAdd)btnAdd.onclick=()=>{playTap();openRecordModal(todayKey());};
  const btnCompare=document.getElementById('btnCompare');
  if(btnCompare)btnCompare.onclick=compareWithSatellite;
  const btnPrint=document.getElementById('btnPrint');
  if(btnPrint)btnPrint.onclick=()=>{playTap();renderPrint();setTimeout(()=>window.print(),100);};
  const btnExport=document.getElementById('btnExport');
  if(btnExport)btnExport.onclick=exportProfile;
  const btnImport=document.getElementById('btnImport');
  if(btnImport)btnImport.onclick=importProfile;

  // Lab
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{playStep(+b.dataset.t>0);lab.temp=Math.min(45,Math.max(-30,lab.temp+(+b.dataset.t)));render();});
  const sl=document.getElementById('sliderTemp');
  if(sl)sl.oninput=e=>{lab.temp=+e.target.value;render();};
  document.querySelectorAll('[data-sky]').forEach(b=>b.onclick=()=>{playTap();lab.sky=b.dataset.sky;render();});
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{playTap();lab.dir=+b.dataset.dir;render();});
  const sw=document.getElementById('sliderWind');
  if(sw)sw.oninput=e=>{lab.wind=+e.target.value;render();};
  const btnCalm=document.getElementById('btnCalm');
  if(btnCalm)btnCalm.onclick=()=>{playTap();lab.dir=null;lab.wind=0;render();};
  const btnFresh=document.getElementById('btnFresh');
  if(btnFresh)btnFresh.onclick=()=>{playTap();lab.dir=1;lab.wind=8;render();};
  const btnFact=document.getElementById('btnFact');
  if(btnFact)btnFact.onclick=()=>{playTap();lab.fact=(lab.fact+1)%6;render();};
  const btnSaveLab=document.getElementById('btnSaveLab');
  if(btnSaveLab)btnSaveLab.onclick=()=>{
    playSuccess();confetti();
    const tk=todayKey();
    const ex=records()[tk];
    records()[tk]={key:tk,temp:Math.round(lab.temp*10)/10,sky:lab.sky,t:ex?.t||'12:00',hum:ex?.hum||50,
      wind:Math.round(lab.wind*10)/10,dir:lab.dir,mood:ex?.mood||'joy',
      notes:ex?.notes?ex.notes+' · Лабораторія':'Спостереження через лабораторію',real:ex?.real||null};
    save();toast(t('saved'));render();
  };

  // Stats table
  const tt=document.getElementById('toggleTable');
  if(tt)tt.onclick=()=>{const w=document.getElementById('tableWrap');w.style.display=w.style.display==='none'?'block':'none';};
}

/* ─────────────── 19. City Modal ─────────────── */
function openCityModal(){
  const p=profile();
  const box=document.createElement('div');
  box.className='modal-backdrop';
  box.innerHTML=`
    <div class="modal-box" style="max-width:460px;">
      <div class="dlg-head">
        <h3 style="margin:0;font-size:1.05rem;font-weight:900;">🌍 ${esc(t('cityPick'))}</h3>
        <button class="btn btn-sm btn-icon" data-x>✕</button>
      </div>
      <div class="dlg-body">
        <form id="cityForm" style="display:flex;gap:6px;">
          <input id="cityQ" placeholder="${esc(t('citySearchPH'))}" style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid #CBD5E1;font-weight:600;">
          <button type="submit" class="btn btn-pri">🔍</button>
        </form>
        <button class="btn" id="btnGeo" style="width:100%;margin-top:8px;">${esc(t('detectLoc'))}</button>
        <div id="cityResults" style="margin-top:12px;max-height:280px;overflow-y:auto;"></div>
        <p style="font-size:.68rem;color:var(--ink3);margin-top:12px;padding:8px;background:var(--sur2);border-radius:10px;line-height:1.5;">🔒 Для супутника надсилаються лише приблизні координати (~1 км). Ім'я та нотатки залишаються у браузері.</p>
      </div>
    </div>`;
  document.getElementById('modalRoot').appendChild(box);
  const close=()=>box.remove();
  box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{playTap();close();});
  box.addEventListener('click',e=>{if(e.target===box)close();});
  const results=box.querySelector('#cityResults');
  const pick=c=>{p.city=c;save();playSuccess();close();render();};

  box.querySelector('#cityForm').onsubmit=async e=>{
    e.preventDefault();const q=box.querySelector('#cityQ').value;
    if(q.length<2)return;
    playTap();results.innerHTML='<div style="text-align:center;padding:20px;">⏳</div>';
    const list=await searchCities(q,S.lang);
    if(!list.length){results.innerHTML='<p style="text-align:center;color:var(--ink3);font-size:.8rem;padding:20px;">'+esc(t('cityNone'))+'</p>';return;}
    results.innerHTML=list.map((c,i)=>`<button class="btn" data-i="${i}" style="width:100%;justify-content:flex-start;text-align:left;margin-bottom:5px;font-size:.8rem;padding:10px 14px;flex-direction:column;align-items:flex-start;gap:2px;">
      <strong>${esc(c.name)}</strong>
      <small style="color:var(--ink3);font-weight:600;">${esc([c.admin,c.country].filter(Boolean).join(', '))}</small>
    </button>`).join('');
    results.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>pick(list[+b.dataset.i]));
  };
  box.querySelector('#btnGeo').onclick=()=>{
    if(!navigator.geolocation){toast('Геолокація недоступна');return;}
    playTap();results.innerHTML='<div style="text-align:center;padding:20px;">📍 Визначаємо...</div>';
    navigator.geolocation.getCurrentPosition(async pos=>{
      const c=await reverseGeo(pos.coords.latitude,pos.coords.longitude,S.lang);
      if(c)pick(c);else results.innerHTML='<p style="color:var(--ink3);font-size:.8rem;text-align:center;padding:14px;">Не вдалося. Введи вручну.</p>';
    },()=>{results.innerHTML='<p style="color:#DC2626;font-size:.8rem;text-align:center;padding:14px;">Дозволь доступ до геолокації.</p>';},{timeout:10000});
  };
}

/* ─────────────── 22. Export / Import ─────────────── */
function exportProfile(){
  playTap();
  const p=profile();
  const data={app:'MeteoJournal',version:7,exportedAt:new Date().toISOString(),profile:p};
  const fn=`Meteo_${p.name.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.weather`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('💾 Файл збережено!');
}
function importProfile(){
  playTap();
  const inp=document.createElement('input');inp.type='file';inp.accept='.weather,.json';
  inp.onchange=async e=>{
    const f=e.target.files?.[0];if(!f)return;
    try{
      const text=await f.text();const j=JSON.parse(text);
      if(j.profile&&typeof j.profile.name==='string'){
        const np={id:'p_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
          name:String(j.profile.name).slice(0,40),cls:String(j.profile.cls||'').slice(0,15),
          avatar:AVATARS.includes(j.profile.avatar)?j.profile.avatar:AVATARS[0],
          city:j.profile.city||{...DEFAULT_CITY},records:j.profile.records||{},xp:+j.profile.xp||0};
        S.profiles.push(np);S.active=np.id;save();playSuccess();confetti();toast('✅ Профіль імпортовано!');render();
      }else toast('❌ Невірний формат файлу');
    }catch(err){toast('❌ Помилка читання');}
  };
  inp.click();
}

/* ─────────────── 23. Compare with satellite ─────────────── */
let comparing=false;
async function compareWithSatellite(){
  if(comparing)return;
  const p=profile();
  if(p.city.lat==null)return;
  const prefix=viewY+'-'+String(viewM+1).padStart(2,'0')+'-';
  const keys=Object.keys(p.records).filter(k=>k.startsWith(prefix));
  if(!keys.length)return;
  comparing=true;playTap();
  toast('🛰️ ' + t('comparing'),5000);
  try{
    const data=await fetchOpenMeteo(p.city,keys);
    Object.entries(data).forEach(([k,real])=>{if(p.records[k])p.records[k]={...p.records[k],real};});
    save();playFanfare();confetti();
    toast('✅ Дані з супутника отримано!');
  }catch(e){console.error(e);toast('❌ Помилка зв\'язку');}
  finally{comparing=false;render();}
}

          <div><strong>${esc(t('printerMonth'))}:</strong> ${esc(monthName)} ${viewY}</div>

      <table style="width:100%;border-collapse:collapse;font-size:10px;text-align:center;">

/* ─────────────── 25. Onboarding ─────────────── */
function showOnboarding(){
  let step=1,name='',cls='3-А',avatar=AVATARS[0],city={...DEFAULT_CITY};
  const box=document.createElement('div');
  box.className='modal-backdrop';
  const r=()=>{
    let body='';
    if(step===1){
      body=`<div style="padding:4px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><span style="width:26px;height:26px;border-radius:50%;background:var(--accS);color:#92400E;font-weight:900;font-size:.75rem;display:flex;align-items:center;justify-content:center;">1</span><strong style="font-size:.88rem;">${esc(t('onbStep1'))}</strong></div>
      <div class="field"><label class="field-label">${esc(t('nameField'))}</label><input id="oName" value="${esc(name)}" placeholder="${esc(t('onbNamePH'))}" autofocus></div>
      <div class="field"><label class="field-label">${esc(t('classField'))}</label><input id="oClass" value="${esc(cls)}" placeholder="${esc(t('onbClassPH'))}"></div>
      <button class="btn btn-pri" id="oNext" style="width:100%;margin-top:8px;">${esc(t('nextBtn'))} →</button></div>`;
    }else if(step===2){
      body=`<div style="padding:4px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><span style="width:26px;height:26px;border-radius:50%;background:var(--accS);color:#92400E;font-weight:900;font-size:.75rem;display:flex;align-items:center;justify-content:center;">2</span><strong style="font-size:.88rem;">${esc(t('onbStep2'))}</strong></div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
        ${AVATARS.map(a=>`<button type="button" data-av="${a}" style="font-size:1.9rem;padding:10px;border-radius:16px;border:2px solid ${a===avatar?'var(--acc)':'var(--line)'};background:${a===avatar?'var(--accS)':'var(--sur2)'};">${a}</button>`).join('')}
      </div>
      <button class="btn btn-pri" id="oNext" style="width:100%;margin-top:14px;">${esc(t('nextBtn'))} →</button></div>`;
    }else{
      body=`<div style="padding:4px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><span style="width:26px;height:26px;border-radius:50%;background:var(--accS);color:#92400E;font-weight:900;font-size:.75rem;display:flex;align-items:center;justify-content:center;">3</span><strong style="font-size:.88rem;">${esc(t('onbStep3'))}</strong></div>
      <form id="oCityForm" style="display:flex;gap:6px;"><input id="oCityQ" placeholder="${esc(t('onbCityPH'))}" style="flex:1;padding:10px 14px;border-radius:12px;border:1px solid #CBD5E1;"><button class="btn btn-pri">🔍</button></form>
      <button class="btn" id="oGeo" style="width:100%;margin-top:8px;">${esc(t('detectLoc'))}</button>
      <div id="oCityRes" style="margin-top:10px;max-height:180px;overflow-y:auto;"></div>
      <div style="padding:10px;background:var(--accS);border-radius:12px;border:1px solid #FCD34D;margin-top:12px;font-weight:800;font-size:.8rem;">📍 ${esc(city.name)}</div>
      <button class="btn btn-acc" id="oFinish" style="width:100%;margin-top:14px;font-size:.95rem;">🚀 ${esc(t('onbStart'))}</button></div>`;
    }
    box.innerHTML=`
      <div class="modal-box" style="max-width:440px;">
        <div style="background:linear-gradient(135deg,#F59E0B,#0EA5E9);padding:22px;text-align:center;color:#fff;">
          <span style="font-size:2.6rem;">🌤️</span>
          <h2 style="margin:6px 0 0;font-size:1.15rem;font-weight:900;">${esc(t('onbWelcome'))}</h2>
          <p style="margin:4px 0 0;font-size:.72rem;opacity:.9;">${esc(t('tagline'))}</p>
        </div>
        <div class="dlg-body">${body}</div>
      </div>`;
    const next=box.querySelector('#oNext');
    if(next)next.onclick=()=>{
      playTap();
      if(step===1){name=box.querySelector('#oName').value.trim();cls=box.querySelector('#oClass').value.trim();if(!name){toast('Введи ім\'я');return;}}
      step++;r();
    };
    box.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{playTap();avatar=b.dataset.av;r();});
    const form=box.querySelector('#oCityForm');
    if(form)form.onsubmit=async e=>{
      e.preventDefault();const q=box.querySelector('#oCityQ').value;
      if(q.length<2)return;playTap();
      const res=box.querySelector('#oCityRes');res.innerHTML='⏳';
      const list=await searchCities(q,S.lang);
      if(!list.length){res.innerHTML='<p style="font-size:.75rem;color:var(--ink3);text-align:center;">'+esc(t('cityNone'))+'</p>';return;}
      res.innerHTML=list.map((c,i)=>`<button class="btn" data-i="${i}" style="width:100%;justify-content:flex-start;text-align:left;margin-bottom:4px;font-size:.75rem;">${esc(c.name)} — ${esc([c.admin,c.country].filter(Boolean).join(', '))}</button>`).join('');
      res.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{playTap();city=list[+b.dataset.i];r();});
    };
    const geo=box.querySelector('#oGeo');
    if(geo)geo.onclick=()=>{
      if(!navigator.geolocation)return;
      playTap();
      navigator.geolocation.getCurrentPosition(async pos=>{const c=await reverseGeo(pos.coords.latitude,pos.coords.longitude,S.lang);if(c){city=c;r();}},()=>{});
    };
    const fin=box.querySelector('#oFinish');
    if(fin)fin.onclick=()=>{
      playSuccess();confetti();
      const p=profile();p.name=name||'Юний синоптик';p.cls=cls;p.avatar=avatar;p.city=city;
      S.onboarded=true;save();box.remove();render();
    };
  };
  r();
  document.getElementById('modalRoot').appendChild(box);
}
